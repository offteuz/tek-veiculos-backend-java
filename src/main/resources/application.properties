# ===================================================================
# Identificação e Servidor
# ===================================================================
spring.application.name=tekveiculos
server.port=8090
server.shutdown=graceful

# ===================================================================
# Persistência Relacional (PostgreSQL + HikariCP)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tekveiculos_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Pool de Conexões (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=TekVeiculosHikariPool

# ===================================================================
# JPA & Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
# Desativa o anti-pattern de manter conexões abertas durante a renderização da resposta
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Migrações de Banco (Flyway)
# ===================================================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ===================================================================
# Redis
# ===================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Deixe em branco caso o Redis local não tenha senha configurada
spring.data.redis.password=${REDIS_PASSWORD:}

# ===================================================================
# Segurança / OAuth2 Resource Server
# ===================================================================
# Validador de tokens JWT via Identity Provider
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8080/realms/tek-realm}

# ===================================================================
# Tratamento de Erros
# ===================================================================
spring.mvc.problemdetails.enabled=true

# ===================================================================
# Documentação de API (SpringDoc OpenAPI / Swagger)
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ===================================================================
# Observabilidade e Saúde (Actuator)
# ===================================================================
# Expõe apenas os endpoints necessários inicialmente
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always